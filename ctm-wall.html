<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CTM Wall - PRO-SAFE</title>
  <style>
    body { margin: 0; font-family: 'Inter', Helvetica, Arial, sans-serif; background: #181f26; }
    .ctm-header { background: #2c5b89; color: #fff; display: flex; align-items: center; padding: 0 32px; height: 64px; font-size: 1.2rem; font-weight: 600; }
    .ctm-header .logo { display: flex; align-items: center; font-size: 2rem; font-weight: bold; margin-right: 16px; }
    .ctm-header .logo-img { width: 48px; height: 48px; margin-right: 12px; background: #2c5b89; border-radius: 50%; padding: 4px; }
    .ctm-header .user { margin-left: auto; font-size: 1.1rem; font-weight: 500; display: flex; align-items: center; gap: 16px; }
    .ctm-header .arrow { font-size: 2rem; margin-left: 18px; cursor: pointer; }
    .ctm-wall-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-gap: 18px; padding: 32px; max-width: 1400px; margin: 0 auto; }
    .ctm-tile { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.10); display: flex; flex-direction: column; min-width: 320px; min-height: 220px; position: relative; }
    .ctm-tile-header { background: #eaf6ff; color: #222; display: flex; align-items: center; padding: 6px 12px; font-size: 1.05rem; font-weight: 600; border-bottom: 1px solid #b2bec6; gap: 8px; }
    .ctm-tile-header .cam-name { color: #2c5b89; font-weight: 700; margin-right: 8px; }
    .ctm-tile-header .icon { width: 22px; height: 22px; margin: 0 2px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.2rem; border-radius: 50%; background: #e0f7e9; color: #1bbf3a; }
    .ctm-tile-header .icon.ctm { background: #eaf6ff; color: #2c5b89; border: 1.5px solid #2c5b89; font-size: 1.1rem; }
    .ctm-tile-header .record-btn { margin-left: 6px; cursor: pointer; font-size: 1.3rem; color: #e53935; background: none; border: none; }
    .ctm-tile-header .record-btn.blink { animation: blink-red 1s steps(1) infinite; }
    @keyframes blink-red { 50% { opacity: 0.3; } }
    .record-timer { margin-left: 8px; color: #e53935; font-size: 1.05rem; font-weight: 700; }
    .ctm-tile-img { width: 100%; height: 180px; object-fit: cover; background: #222; display: block; }
    .ctm-tile-footer { background: #f5f5f5; color: #222; font-size: 0.98rem; padding: 6px 12px; border-top: 1px solid #b2bec6; min-height: 32px; }
    .ctm-empty { color: #fff; text-align: center; margin: 80px auto; font-size: 1.3rem; }
    .ctm-empty a { color: #f0b178; text-decoration: underline; margin-left: 8px; }
    .record-tags { background: #f5f5f5; padding: 12px 18px; display: flex; flex-direction: row; gap: 32px; border-top: 1px solid #b2bec6; }
    .record-tags-group { display: flex; flex-direction: column; gap: 6px; }
    .record-tags-group label { font-size: 1rem; color: #2c5b89; font-weight: 500; }
    .record-notes-box { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .record-notes-input { width: 100%; min-height: 36px; border: 1.5px solid #2c5b89; border-radius: 6px; padding: 6px 10px; font-size: 1rem; resize: vertical; }
    .record-notes-save { background: #2c5b89; color: #fff; border: none; border-radius: 6px; padding: 7px 18px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .record-notes-save:hover { background: #1e4062; }
    .bell-icons { display: flex; gap: 4px; margin-left: 6px; }
    .bell-icon { width: 22px; height: 22px; cursor: pointer; border-radius: 50%; padding: 2px; display: flex; align-items: center; justify-content: center; }
    .bell-green svg { fill: #1bbf3a; }
    .bell-orange svg { fill: #f0b178; }
    .bell-red svg { fill: #e53935; }
    .bell-icon:hover { background: #eaf6ff; }
    .bell-alarm-msg { color: #2c5b89; font-size: 1rem; margin: 4px 0 0 0; font-weight: 500; display: none; }
    @media (max-width: 1100px) { .ctm-wall-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 700px) { .ctm-wall-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="ctm-header">
    <span class="logo"><img src="https://via.placeholder.com/48x48?text=PS" class="logo-img" alt="Logo" />PRO-SAFE</span>
    <span class="user">CLM User <span class="arrow">&#8594;</span></span>
  </div>
  <div id="ctmWallContent"></div>
  <script>
    function renderCTMWall() {
      const container = document.getElementById('ctmWallContent');
      let selected = [];
      try { selected = JSON.parse(localStorage.getItem('selectedCameras')) || []; } catch (e) { selected = []; }
      if (!selected || selected.length === 0) { container.innerHTML = `<div class='ctm-empty'>No cameras selected.<a href='index.html'>Go back</a></div>`; return; }
      let html = `<div class='ctm-wall-grid'>`;
      selected.forEach((cam, idx) => {
        html += `<div class='ctm-tile' data-cam-idx='${idx}'>
          <div class='ctm-tile-header'>
            <span class='cam-name'>Cam${(idx+1).toString().padStart(2,'0')}</span>
            <span class='icon' title='Online'>&#9679;</span>
            <span class='icon ctm' title='CTM'>CTM</span>
            <button class='record-btn' title='Record' data-cam-idx='${idx}'><span style='font-size:1.3rem;'>●</span></button>
            <span class='record-timer' id='record-timer-${idx}' style='display:none;'>00:00</span>
            <span class='bell-icons'>
              <span class='bell-icon bell-green' data-cam-idx='${idx}'><svg viewBox='0 0 24 24' width='18' height='18'><path d='M12 22c1.1 0 2-.9 2-2h-4a2 2 0 0 0 2 2zm6-6V11c0-3.07-1.63-5.64-5-6.32V4a1 1 0 1 0-2 0v.68C7.63 5.36 6 7.92 6 11v5l-1.29 1.29A1 1 0 0 0 6 19h12a1 1 0 0 0 .71-1.71L18 16z'/></svg></span>
              <span class='bell-icon bell-orange' data-cam-idx='${idx}'><svg viewBox='0 0 24 24' width='18' height='18'><path d='M12 22c1.1 0 2-.9 2-2h-4a2 2 0 0 0 2 2zm6-6V11c0-3.07-1.63-5.64-5-6.32V4a1 1 0 1 0-2 0v.68C7.63 5.36 6 7.92 6 11v5l-1.29 1.29A1 1 0 0 0 6 19h12a1 1 0 0 0 .71-1.71L18 16z'/></svg></span>
              <span class='bell-icon bell-red' data-cam-idx='${idx}'><svg viewBox='0 0 24 24' width='18' height='18'><path d='M12 22c1.1 0 2-.9 2-2h-4a2 2 0 0 0 2 2zm6-6V11c0-3.07-1.63-5.64-5-6.32V4a1 1 0 1 0-2 0v.68C7.63 5.36 6 7.92 6 11v5l-1.29 1.29A1 1 0 0 0 6 19h12a1 1 0 0 0 .71-1.71L18 16z'/></svg></span>
            </span>
          </div>
          <div class='bell-alarm-msg' id='bell-alarm-msg-${idx}'>Alarm triggered successfully</div>
          <img class='ctm-tile-img' src='${cam.img}' alt='${cam.alt}' />
          <div class='ctm-tile-footer'>Camera ${idx + 1} - ${cam.alt || 'Unknown Location'}</div>
          <div class='record-tags' id='record-tags-${idx}' style='display:none;'>
            <div class='record-tags-group'><label>CLM tags</label><label><input type='radio' name='clm-tag-${idx}' value='Person' disabled> CLM- Person Observed</label><label><input type='radio' name='clm-tag-${idx}' value='Vehicle' disabled> CLM- Vehicle Observed</label></div>
            <div class='record-tags-group'><label>CTM tags</label><label><input type='radio' name='ctm-tag-${idx}' value='Person' disabled> CTM- Person Observed</label><label><input type='radio' name='ctm-tag-${idx}' value='Vehicle' disabled> CTM- Vehicle Observed</label></div>
            <div class='record-notes-box' id='record-notes-box-${idx}' style='display:none;'><textarea class='record-notes-input' placeholder='Enter notes...' disabled></textarea><button class='record-notes-save' disabled>Save</button></div>
          </div>
        </div>`;
      });
      html += `</div>`;
      container.innerHTML = html;
      selected.forEach((cam, idx) => {
        const recBtn = document.querySelector(`.record-btn[data-cam-idx='${idx}']`);
        const timerSpan = document.getElementById(`record-timer-${idx}`);
        const tagsDiv = document.getElementById(`record-tags-${idx}`);
        const bellMsg = document.getElementById(`bell-alarm-msg-${idx}`);
        let timer = null, seconds = 0, recording = false;
        function updateTimer() { timerSpan.textContent = String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0'); }
        recBtn.onclick = function() {
          if (!recording) { recording = true; seconds = 0; recBtn.classList.add('blink'); timerSpan.style.display = 'inline'; tagsDiv.style.display = 'none'; updateTimer(); timer = setInterval(() => { seconds++; updateTimer(); if (seconds >= 120) stopRecording(); }, 1000); }
          else { stopRecording(); }
        };
        function stopRecording() { if (timer) clearInterval(timer); recBtn.classList.remove('blink'); timerSpan.style.display = 'none'; tagsDiv.style.display = 'flex'; recording = false; }
        document.querySelectorAll(`.bell-icon[data-cam-idx='${idx}']`).forEach(bell => { bell.onclick = () => { bellMsg.style.display = 'block'; setTimeout(() => { bellMsg.style.display = 'none'; }, 2000); }; });
      });
    }
    renderCTMWall();
  </script>
</body>
</html>
