<!DOCTYPE html>
<html lang="en">
<head>

  <title>Pro-Safe HTML Files</title>

      color: #222;
    }
    header {
      background: #0f4c81;
      color: white;
      padding: 20px;
      text-align: center;
    }
    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .card h3 {
      margin-top: 0;
    }
    .card a {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
      background: #0f4c81;
      color: white;
      padding: 10px 14px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <header>

    <p>Portal for all available pages</p>
  </header>

  <main>
    <div class="grid">
      <div class="card">
        <h3>LPR Admin Info</h3>
        <a href="lpr-admin-info-page.html">Open</a>
      </div>

      <div class="card">
        <h3>LPR Info on L2 & L3 Wall</h3>
        <a href="lpr-info-on-L2%26L3wall.html">Open</a>
      </div>

      <div class="card">

        <a href="safety-monitoringservices-wall.html">Open</a>
      </div>

      <div class="card">

      </div>

      <div class="card">
        <h3>Admin Site Info</h3>
        <a href="admin-site-info-page.html">Open</a>
      </div>

      <div class="card">
        <h3>Incident Radar Report</h3>
        <a href="incident-radar-report.html">Open</a>
      </div>
    </div>
  </main>
</body>
</html>
